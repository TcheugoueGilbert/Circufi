mutation CreateTask($title: String!, $dueDate: Timestamp!, $userId: UUID, $groupId: UUID!) @auth(level: USER) {
  task_insert(
    data: {
      title: $title
      dueDate: $dueDate
      userId: $userId
      groupId: $groupId
    }
  )
}

mutation UpdateTaskStatus($id: UUID!, $status: String!) @auth(level: USER) {
  task_update(key: { id: $id }, data: { status: $status })
}

query ListGroupTasks($groupId: UUID!) @auth(level: USER) {
  tasks(where: { groupId: { eq: $groupId } }) {
    id
    title
    status
    dueDate
    user {
      fullName
    }
  }
}

query GetUserTasks @auth(level: USER) {
  tasks(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    title
    dueDate
    status
  }
}